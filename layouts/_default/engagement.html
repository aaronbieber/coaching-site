{{ define "main" }}
<div class="blog-item">
  {{ partial "pageheading.html" (dict "title" .Title) }}

  {{ .Content }}

  <div class="price-box">
    <div class="price-tag">
      <span class="price-current">{{ .Params.price }}</span>
    </div>
    {{ with .Params.price_detail }}<p class="price-note">{{ . }}</p>{{ end }}
  </div>

  <h2>Apply</h2>
  {{ with .Params.tagline }}<p>{{ . }}</p>{{ end }}

  {{ partial "signupform.html" . }}
</div>
{{ end }}
